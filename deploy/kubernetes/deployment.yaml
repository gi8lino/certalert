---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: certalert
spec:
  selector:
    matchLabels:
      app: certalert
  template:
    metadata:
      labels:
        app: certalert
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: certalert
          image: ghcr.io/thurgauerkb/certalert:latest
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /config
            - name: passwords-file
              mountPath: /passwords
            - name: certs
              mountPath: /certs
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: certalert-config
        - name: certs
          configMap:
            name: certificates
        - name: passwords-file
          secret:
            secretName: password-file
        - name: tmp
          emptyDir: {}
