---
# Requires the Prometheus Operator CRDs. Adjust metadata.labels to match the
# Prometheus instance that should select this PrometheusRule.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: certalert
  labels:
    app: certalert
spec:
  groups:
    - name: certalert.certificates
      rules:
        - alert: CertificateExpiringSoon
          expr: certalert_certificate_validity == 0 and certalert_certificate_days_remaining < 14 and certalert_certificate_days_remaining >= 3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Certificate expires within 14 days
            description: Certificate {{ $labels.certificate_name }} (alias {{ $labels.alias }}) expires in {{ $value | printf "%.1f" }} days.

        - alert: CertificateExpiringUrgently
          expr: certalert_certificate_validity == 0 and certalert_certificate_days_remaining < 3
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Certificate expires within three days
            description: Certificate {{ $labels.certificate_name }} (alias {{ $labels.alias }}) expires in {{ $value | printf "%.1f" }} days.

        - alert: CertificateExpired
          expr: certalert_certificate_validity == 1 and certalert_certificate_expiration_seconds <= time()
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Certificate has expired
            description: Certificate {{ $labels.certificate_name }} (alias {{ $labels.alias }}) has expired.

        - alert: CertificateInvalid
          expr: certalert_certificate_validity == 1 unless certalert_certificate_expiration_seconds <= time()
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Certificate cannot be validated
            description: Certificate {{ $labels.certificate_name }} (alias {{ $labels.alias }}) could not be loaded or is outside its validity period.
